org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Prevent Kotlin incremental cache path issues on Windows when the repo and
# Pub Cache live on different drives (for example D: project + C: Pub Cache).
kotlin.incremental=false
